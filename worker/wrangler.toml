name = "p2p-cinema-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 前端静态资产与 API 同域部署：/api/* 进 Worker，其余由静态资产服务
[assets]
directory = "../frontend"
run_worker_first = ["/api/*"]

# v2：房间状态 + 信令全部收敛进 Durable Object（SQLite 存储）
# 免费套餐（Workers Free）即可使用 —— SQLite 存储类 DO 是免费计划支持的形态
# （key-value 存储 DO 需要付费计划，因此必须用 new_sqlite_classes）
# KV 已完全移除：部署不再需要创建 KV namespace 或回填任何 id（零配置）
[durable_objects]
bindings = [{ name = "ROOMS", class_name = "RoomSignalDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomSignalDO"]
