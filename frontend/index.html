<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Cinema - 在线观影</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 首页 -->
  <div id="home-page" class="page active">
    <div class="home-container">
      <h1>🎬 P2P Cinema</h1>
      <p class="subtitle">和好友一起在线观影</p>
      <div class="home-actions">
        <input type="text" id="input-nickname" placeholder="输入昵称（可选）" maxlength="20" autocomplete="off">
        <button id="btn-create" class="btn btn-primary">创建房间</button>
        <div class="divider">或</div>
        <div class="join-box">
          <input type="text" id="input-room-code" placeholder="输入邀请码" maxlength="6" autocomplete="off">
          <button id="btn-join" class="btn btn-secondary">加入房间</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 房间页 -->
  <div id="room-page" class="page">
    <header class="room-header">
      <div class="room-info">
        <span class="room-label">邀请码:</span>
        <span id="room-code-display" class="room-code"></span>
        <button id="btn-copy-code" class="btn btn-small">复制</button>
      </div>
      <div class="room-status">
        <span id="participant-count">在线: 1人</span>
        <button id="btn-leave" class="btn btn-danger btn-small">离开房间</button>
      </div>
    </header>

    <div class="room-content">
      <div class="mode-switch">
        <button id="btn-mode-screen" class="btn btn-mode active">屏幕共享</button>
        <button id="btn-mode-url" class="btn btn-mode">URL 同步播放</button>
      </div>

      <!-- 屏幕共享模式 -->
      <div id="screen-mode" class="mode-panel active">
        <div class="video-container">
          <video id="screen-video" autoplay playsinline></video>
          <div id="screen-placeholder" class="video-placeholder">
            <p>等待屏幕共享...</p>
          </div>
          <div class="video-toolbar">
            <button class="toolbar-btn" data-action="play-pause" data-target="screen-video" title="播放/暂停">▶</button>
            <button class="toolbar-btn" data-action="pip" data-target="screen-video" title="画中画">⧉</button>
            <button class="toolbar-btn" data-action="fit" data-target="screen-video" title="缩放模式">⤢</button>
            <button class="toolbar-btn" data-action="fullscreen" data-target="screen-video" title="全屏">⛶</button>
          </div>
        </div>
        <div class="controls">
          <button id="btn-share-screen" class="btn btn-primary">开始共享屏幕</button>
          <button id="btn-stop-screen" class="btn btn-danger" style="display:none;">停止共享</button>
          <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" id="screen-volume" class="volume-slider" min="0" max="1" step="0.05" value="1">
          </div>
        </div>
      </div>

      <!-- URL 同步播放模式 -->
      <div id="url-mode" class="mode-panel">
        <div class="url-input-box">
          <input type="text" id="input-video-url" placeholder="输入视频直链 URL (mp4/webm)">
          <button id="btn-load-url" class="btn btn-primary">加载</button>
        </div>
        <div class="video-container">
          <video id="url-video" controls playsinline></video>
          <div id="url-placeholder" class="video-placeholder">
            <p>输入视频 URL 开始观影</p>
          </div>
          <div class="video-toolbar">
            <button class="toolbar-btn" data-action="pip" data-target="url-video" title="画中画">⧉</button>
            <button class="toolbar-btn" data-action="fit" data-target="url-video" title="缩放模式">⤢</button>
            <button class="toolbar-btn" data-action="fullscreen" data-target="url-video" title="全屏">⛶</button>
          </div>
        </div>
        <div class="controls">
          <div class="volume-control">
            <span class="volume-icon">🔊</span>
            <input type="range" id="url-volume" class="volume-slider" min="0" max="1" step="0.05" value="1">
          </div>
        </div>
      </div>
    </div>

    <!-- 聊天/成员侧栏 -->
    <aside class="chat-sidebar">
      <div class="sidebar-tabs">
        <button id="tab-chat" class="sidebar-tab active">聊天</button>
        <button id="tab-members" class="sidebar-tab">成员</button>
      </div>
      <div id="chat-panel" class="sidebar-panel active">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-box">
          <input type="text" id="input-chat" placeholder="输入消息..." autocomplete="off">
          <button id="btn-send-chat" class="btn btn-small">发送</button>
        </div>
      </div>
      <div id="members-panel" class="sidebar-panel">
        <div id="members-list" class="members-list"></div>
      </div>
    </aside>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
